# Example grid layout configuration
layout: Grid Example

grid:
  rows: 3
  columns: 4
  elements:
    - name: header
      row: 0
      column: 0
      colspan: 4
    - name: sidebar
      row: 1
      column: 0
      rowspan: 2
    - name: content
      row: 1
      column: 1
      colspan: 3
    - name: footer
      row: 2
      column: 1
      colspan: 3
